name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The repository is pnpm-managed; pnpm-lock.yaml is the lockfile of record.
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      # The suite drives the agent loop, recovery planner and provider decoders
      # with no network and no extension host, so it runs unchanged in CI.
      # Checkpoint tests shell out to real git, hence the identity below.
      - name: Configure git for checkpoint tests
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global commit.gpgsign false

      - name: Test
        run: pnpm test

      - name: Package
        run: pnpm exec vsce package --no-dependencies --out coderelay.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: coderelay-vsix
          path: coderelay.vsix
